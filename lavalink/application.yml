# Konfigurasi Lavalink v4 — mesin audio Harmony.
# Dipasang read-only ke container oleh docker-compose.yml.
#
# Password dibaca dari environment LAVALINK_SERVER_PASSWORD (lihat compose).
# Jangan simpan password asli di file ini.

server:
  port: ${SERVER_PORT:2333}
  address: 0.0.0.0

# ── Konfigurasi plugin (level root, bukan di dalam `lavalink:`) ────────────
plugins:
  # Sumber audio utama: YouTube lewat plugin resmi lavalink-devs.
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Urutan klien penting: yang pertama dicoba lebih dulu.
    #
    # ANDROID_VR ditaruh pertama karena itu satu-satunya klien yang terukur
    # benar-benar bisa mengirim audio dari mesin ini (alat ukurnya
    # tools/yts-probe.mjs, dan lihat bagian "Musik tidak bisa dimuat" di
    # README.md). Sebelumnya di sini ditulis MUSIC, dan nama itu tidak dikenal
    # plugin: ia diam-diam menggantinya dengan klien bawaan, jadi config terlihat
    # punya empat klien padahal hanya tiga yang pernah dimaksud. `WEB_REMIX` juga
    # ditolak dengan cara yang sama -- itu nama internal, bukan nama config.
    # tools/yts-probe.mjs mencetak daftar klien yang benar-benar terpakai
    # ("dipakai=..."), jadi perubahan ini bisa dicek, bukan diasumsikan.
    #
    # Kalau semua klien gagal dengan "All clients failed to load the item", itu
    # bukan soal daftar di bawah. Ukuran 5 Okt 2026 di mesin ini: video kontrol
    # tetap dapat URL audio dari IP yang sama, sementara lagu musik dijawab
    # "Sign in to confirm you're not a bot" -- penolakannya per-item, bukan
    # per-IP. Obatnya karena itu OAuth (login), bukan ganti klien atau ganti IP:
    # https://github.com/lavalink-devs/youtube-source#using-oauth-tokens
    clients:
      - ANDROID_VR
      - WEB
      - MWEB
      - ANDROID_MUSIC
      - IOS
      # TV hanya berguna kalau OAuth menyala: tanpa itu YouTube meminta
      # "Sign in to confirm you're not a bot". Diletakkan paling akhir supaya
      # tidak menambah satu percobaan gagal per lagu saat OAuth masih mati.
      - TV

    # OAuth YouTube. Mati secara bawaan supaya instalasi baru berperilaku sama
    # seperti sebelumnya; nyalakan YOUTUBE_OAUTH_ENABLED=true saat pemutaran
    # terblokir.
    #
    # Dengan `enabled: true` dan YOUTUBE_REFRESH_TOKEN kosong, plugin menjalankan
    # alur OAuth sekali lalu mencetak refresh token ke log Lavalink; salin nilai
    # itu ke YOUTUBE_REFRESH_TOKEN supaya alurnya tidak diulang tiap start.
    #
    # Batas yang jujur: ini TIDAK diuji sampai tuntas di sini, karena menyelesaikan
    # alur itu butuh akun Google seseorang. README youtube-source juga
    # memperingatkan bahwa OAuth bisa memicu rate limit saat trafik tinggi, dan
    # lebih baik dipakai akun sekali pakai daripada akun utama.
    oauth:
      enabled: ${YOUTUBE_OAUTH_ENABLED:false}
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"

  # LavaSrc: metadata Spotify/Apple Music + lirik (dipakai mulai Fase 2).
  # Sumber berbayar dibiarkan false supaya tidak butuh kredensial; yang menyala
  # di sini hanya ytdlp, yang tidak butuh kredensial sama sekali.
  lavasrc:
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: true
      jiosaavn: false
      flowerytts: false
      youtube: false

    # Sumber yt-dlp: pengambil audio YouTube lewat biner `yt-dlp`, dan ia juga
    # mendaftarkan `ytsearch:` sendiri (terlihat di log sebagai
    # "Registering YTDLP audio source manager...").
    #
    # Kenapa dinyalakan: youtube-plugin 1.18.2 tidak punya klien yang diterima
    # YouTube untuk lagu-lagu musik dari mesin ini. Terukur 5 Okt 2026: klien
    # visionOS yang dipakai yt-dlp mengunduh 300 KB dari video yang sama
    # (wsEkktRGZ18) di jalur IPv4 maupun IPv6, sementara semua klien plugin
    # dijawab "This video requires login"; versi plugin terbaru (1.18.2) tidak
    # memuat klien visionOS sama sekali. Lewat sumber ini, `ytsearch:` benar
    # benar mulai diputar — dibuktikan tools/ytdlp-probe.mjs.
    #
    # Batas yang jujur: audionya tetap berasal dari YouTube, jadi ini bukan cara
    # memenuhi permintaan "jangan pakai YouTube". Binernya juga harus ada di
    # mesin yang menjalankan Lavalink — image Docker resmi Lavalink tidak
    # memuatnya, jadi di sana ini perlu dipasang sendiri atau diarahkan ke biner
    # di host lewat YTDLP_PATH.
    ytdlp:
      path: "${YTDLP_PATH:yt-dlp}"

    lyrics-sources:
      lrcLib: true # lirik gratis tanpa kredensial, siap dipakai nanti
    spotify:
      countryCode: "ID"

lavalink:
  # Plugin diunduh otomatis saat container pertama kali start.
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false

  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    sources:
      youtube: false # WAJIB false: sudah ditangani youtube-plugin di atas
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: false
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    ratelimit:
      ipBlocks: []
      excludedIps: []
      strategy: RotateOnBan
      searchTriggersFail: true
      retryLimit: 3

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
