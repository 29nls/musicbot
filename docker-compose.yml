# Stack lengkap Harmony: bot + mesin audio (Lavalink) + cache + database.
#
#   docker compose up -d --build      # semua service
#   docker compose up -d postgres     # database saja
#   docker compose logs -f bot        # lihat log bot
#   docker compose logs -f dashboard  # lihat log dashboard web (PRD-DASHBOARD.md)
#
# Nilai rahasia dibaca dari file .env di folder ini (lihat .env.example).
#
# Database berjalan sebagai service `postgres` di stack ini, dengan data di
# volume `postgres_data`. `DATABASE_URL` di .env menunjuk ke `localhost` supaya
# bot/dashboard yang dijalankan dari host (`npm run dev`) bisa memakainya; di
# dalam container nilai itu ditimpa menjadi hostname `postgres`, karena
# `localhost` di dalam container menunjuk ke container itu sendiri.

name: harmony

services:
  # Terapkan migrasi database sebelum bot start. Memakai stage `build` dari
  # Dockerfile karena Prisma CLI ada di devDependencies.
  migrate:
    build:
      context: .
      # Tahap `deps` (bukan `build`): migrate hanya butuh Prisma CLI + dotenv,
      # dan tahap `build` sudah memangkas devDependencies lewat `npm prune`.
      target: deps
    image: harmony-bot:deps
    container_name: harmony-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      # Hostname `localhost` di .env tidak berlaku di dalam container.
      DATABASE_URL: postgresql://${POSTGRES_USER:-harmony}:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}@postgres:5432/${POSTGRES_DB:-harmony}
    # `migrate deploy` menerapkan migrasi yang sudah ada; penulisan migrasi baru
    # dilakukan dari host dengan `npm run db:migrate`.
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: .
    image: harmony-bot:local
    container_name: harmony-bot
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Hostname diganti ke nama service supaya bot bisa menemukan container
      # yang lain.
      DATABASE_URL: postgresql://${POSTGRES_USER:-harmony}:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}@postgres:5432/${POSTGRES_DB:-harmony}
      REDIS_URL: redis://redis:6379
      LAVALINK_HOST: lavalink
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    # PRD 5.1: endpoint /health dipakai monitoring (liveness). Port tidak
    # dipublish ke host — hanya tersedia di jaringan internal compose.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Dashboard web (PRD-DASHBOARD.md, keputusan D7): layanan
  # terpisah di compose yang sama. Build sendiri, TIDAK PERNAH
  # menjalankan migrasi (migrasi milik repo bot — lihat service
  # `migrate`), dan port hanya di-bind ke loopback: dashboard
  # tidak perlu dijangkau dari jaringan lain, dan membatasi
  # paparan permukaan OAuth.
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: harmony-dashboard:local
    container_name: harmony-dashboard
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Hostname service, supaya dashboard menemukan Postgres dan Redis.
      DATABASE_URL: postgresql://${POSTGRES_USER:-harmony}:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}@postgres:5432/${POSTGRES_DB:-harmony}
      REDIS_URL: redis://redis:6379
      # Dipaksa ke 3000 dan port yang dipublish juga 3000 supaya
      # keduanya tidak bisa melenceng — persis seperti HEALTH_PORT
      # di service bot. Nilai DASHBOARD_PORT lain di .env diabaikan
      # di stack ini; kalau diisi berbeda, health check di bawah
      # memprobe port yang salah.
      DASHBOARD_PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Hanya loopback: tidak ada alasan peramban di host lain
    # mengakses dashboard langsung dari mesin ini.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  lavalink:
    build:
      context: .
      dockerfile: deploy/casaos/lavalink.Dockerfile
    image: harmony-lavalink:local
    container_name: harmony-lavalink
    restart: always
    environment:
      # Harus sama dengan LAVALINK_PASSWORD di .env (dipakai bot untuk login).
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?isi LAVALINK_PASSWORD di .env}
      # OAuth YouTube: jalur login, bukan satu-satunya perbaikan. Kosong secara
      # bawaan supaya instalasi yang sudah jalan tidak berubah perilaku.
      # Lihat bagian "Musik tidak bisa dimuat" di README.md.
      YOUTUBE_OAUTH_ENABLED: ${YOUTUBE_OAUTH_ENABLED:-false}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      # Jalur biner yt-dlp untuk sumber `lavasrc.sources.ytdlp` (pengambil audio
      # YouTube ketika klien youtube-plugin ditolak YouTube). Sengaja TIDAK
      # dibaca dari .env: di dalam container nilainya harus `yt-dlp` dari PATH
      # image, sementara .env biasanya berisi jalur Windows/macOS milik host.
      # Image resmi Lavalink belum memuat yt-dlp (lihat README, bagian "Musik
      # tidak bisa dimuat").
      YTDLP_PATH: yt-dlp
      # Heap Lavalink. Naikkan (mis. -Xmx2G) kalau sering memutar lagu panjang.
      JAVA_TOOL_OPTIONS: -Xmx1G
    volumes:
      # Plugin (youtube-source, LavaSrc) diunduh sekali lalu disimpan di sini.
      - lavalink_plugins:/opt/Lavalink/plugins
    # Sengaja TIDAK memakai ports: agar hanya bisa diakses dari jaringan compose.
    # Butuh debug dari host? Tambahkan:  ports: ["127.0.0.1:2333:2333"]
    expose:
      - "2333"
    # Healthcheck memastikan Lavalink sudah siap (port 2333 menjawab) sebelum
    # bot mencoba menyambung — tanpa ini bot start duluan dan node Lavalink
    # gagal terhubung lalu tidak pernah mencoba lagi.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- --header="Authorization: $$LAVALINK_SERVER_PASSWORD" http://127.0.0.1:2333/v4/info >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Postgres lokal — satu-satunya database bot, datanya di volume
  # `postgres_data`. Service ini ikut start bersama stack; kalau hanya
  # database yang dibutuhkan: `docker compose up -d postgres`.
  postgres:
    image: postgres:16-alpine
    container_name: harmony-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harmony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-harmony}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harmony} -d ${POSTGRES_DB:-harmony}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Dipublish ke loopback supaya `npm run db:deploy`, `npm run db:migrate`,
    # dan Prisma Studio di host bisa menjangkau database ini lewat localhost.
    # Hanya 127.0.0.1: database tidak terbuka ke jaringan lain.
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: harmony-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  lavalink_plugins:
