# Stack lengkap Harmony: bot + mesin audio (Lavalink) + cache.
#
#   docker compose up -d --build      # semua service
#   docker compose up -d lavalink     # mesin audio saja (untuk `npm run dev` dari host)
#   docker compose logs -f bot        # lihat log bot
#
# Nilai rahasia dibaca dari file .env di folder ini (lihat .env.example).
#
# DATABASE TIDAK ADA DI STACK INI. Database produksi adalah Supabase, jadi
# `DATABASE_URL` (dan `DIRECT_URL` untuk Prisma CLI) diambil apa adanya dari
# .env. Compose sengaja tidak menimpanya: menimpa URL dengan hostname
# container berarti bot diam-diam bicara ke database yang berbeda dari yang
# migration-nya tadi diterapkan.
#
# Container `postgres` masih ada, tapi hanya untuk menulis & menguji migrasi
# secara lokal, dan harus diminta lewat profile:
#
#   docker compose --profile local up -d postgres
#
# Setelah itu pakai DATABASE_URL/POSTGRES_* versi lokal untuk `npm run db:migrate`,
# lalu deploy hasilnya ke Supabase dengan `npm run db:deploy`.

name: harmony

services:
  # Terapkan migrasi database sebelum bot start. Memakai stage `build` dari
  # Dockerfile karena Prisma CLI ada di devDependencies.
  migrate:
    build:
      context: .
      target: build
    image: harmony-bot:build
    container_name: harmony-migrate
    restart: "no"
    env_file:
      - .env
    # `migrate deploy` (bukan `migrate dev`) karena yang kedua butuh shadow
    # database, dan Supabase tidak mengizinkan membuatnya.
    command: ["npx", "prisma", "migrate", "deploy"]

  bot:
    build: .
    image: harmony-bot:local
    container_name: harmony-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Hostname diganti ke nama service supaya bot bisa menemukan container
      # yang lain. DATABASE_URL/DIRECT_URL sengaja TIDAK diganti: database
      # ada di luar stack ini (Supabase).
      REDIS_URL: redis://redis:6379
      LAVALINK_HOST: lavalink
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      lavalink:
        condition: service_started
    # PRD 5.1: endpoint /health dipakai monitoring (liveness). Port tidak
    # dipublish ke host — hanya tersedia di jaringan internal compose.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: harmony-lavalink
    restart: unless-stopped
    environment:
      # Harus sama dengan LAVALINK_PASSWORD di .env (dipakai bot untuk login).
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?isi LAVALINK_PASSWORD di .env}
      # OAuth YouTube: jalur login, bukan satu-satunya perbaikan. Kosong secara
      # bawaan supaya instalasi yang sudah jalan tidak berubah perilaku.
      # Lihat bagian "Musik tidak bisa dimuat" di README.md.
      YOUTUBE_OAUTH_ENABLED: ${YOUTUBE_OAUTH_ENABLED:-false}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      # Jalur biner yt-dlp untuk sumber `lavasrc.sources.ytdlp` (pengambil audio
      # YouTube ketika klien youtube-plugin ditolak YouTube). Sengaja TIDAK
      # dibaca dari .env: di dalam container nilainya harus `yt-dlp` dari PATH
      # image, sementara .env biasanya berisi jalur Windows/macOS milik host.
      # Image resmi Lavalink belum memuat yt-dlp (lihat README, bagian "Musik
      # tidak bisa dimuat").
      YTDLP_PATH: yt-dlp
      # Heap Lavalink. Naikkan (mis. -Xmx2G) kalau sering memutar lagu panjang.
      JAVA_TOOL_OPTIONS: -Xmx1G
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # Plugin (youtube-source, LavaSrc) diunduh sekali lalu disimpan di sini.
      - lavalink_plugins:/opt/Lavalink/plugins
    # Sengaja TIDAK memakai ports: agar hanya bisa diakses dari jaringan compose.
    # Butuh debug dari host? Tambahkan:  ports: ["127.0.0.1:2333:2333"]
    expose:
      - "2333"
    # Lavalink belum punya healthcheck bawaan; bot akan mencoba reconnect sendiri.

  # Postgres lokal — OPSIONAL, hanya untuk menulis & menguji migrasi.
  # Tidak ikut start unless profile `local` diminta. Database yang dipakai
  # bot tetap Supabase (lihat .env.example).
  postgres:
    image: postgres:16-alpine
    container_name: harmony-postgres
    restart: unless-stopped
    profiles: ["local"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harmony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-harmony}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harmony} -d ${POSTGRES_DB:-harmony}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Butuh akses dari host (mis. Prisma Studio)? Buka sebaris ini:
    # ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    container_name: harmony-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  lavalink_plugins:
